[package]
name = "dot-system"
version = "1.1.0"
description = "A lightweight dot-matrix system monitor"
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "dot_system_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is required for a truly transparent window on macOS.
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# CPU, memory, disk and network readings (pinned: its API changes between minor versions)
sysinfo = "=0.32.1"
# Battery level / charging / time remaining on Windows and macOS
starship-battery = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
